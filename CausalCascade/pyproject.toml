[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalcascade-dataset"
version = "0.1.0"
description = "Lazy media loader for the CausalCascade benchmark"
requires-python = ">=3.10"
license = { text = "CC BY 4.0" }
dependencies = [
  "datasets>=4.0,<5",
  "huggingface_hub>=0.30,<2",
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "torch>=2.2",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8,<5.1"]

[project.urls]
Homepage = "https://huggingface.co/datasets/deepdeltalab/CausalCascade"
Repository = "https://github.com/SJTU-DeepDeltaLab/CausalCascade"

[tool.setuptools.packages.find]
include = ["causalcascade*"]
